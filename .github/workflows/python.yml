name: Python app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Smoke test
        run: python tools/smoke_test.py

      - name: Package
        run: git archive --format=zip --prefix=K580-RGB/ -o K580-RGB-python.zip HEAD k580rgb k580rgb.pyw run.bat requirements.txt README.md USAGE.md

      - uses: actions/upload-artifact@v4
        with:
          name: K580-RGB-python
          path: K580-RGB-python.zip
